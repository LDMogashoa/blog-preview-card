* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: 'Figtree', sans-serif;
background-color: hsl(47, 88%, 63%);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
}

.card {
background-color: white;
border-radius: 20px;
border: 1.5px solid hsl(0, 0%, 7%);
box-shadow: 8px 8px 0px hsl(0, 0%, 7%);
width: 100%;
max-width: 384px;
overflow: hidden;
cursor: pointer;
}

.card:hover {
transform: translate(-4px, -4px);
box-shadow: 12px 12px 0px hsl(0, 0%, 7%);
transition: 0.2s;
}

.card-image {
padding: 24px 24px 0px 24px;
}

.card-image svg {
width: 100%;
border-radius: 12px;
display: block;
}

.card-content {
padding: 24px;
display: flex;
flex-direction: column;
gap: 12px;
}

.tag {
background-color: hsl(47, 88%, 63%);
color: hsl(0, 0%, 7%);
font-size: 14px;
font-weight: 800;
padding: 6px 14px;
border-radius: 4px;
width: fit-content;
}

.date {
font-size: 14px;
font-weight: 500;
color: hsl(0, 0%, 7%);
}

.title {
font-size: 20px;
font-weight: 800;
color: hsl(0, 0%, 7%);
line-height: 1.3;
}

.card:hover .title {
color: hsl(47, 88%, 63%);
}

.description {
font-size: 16px;
font-weight: 500;
color: hsl(0, 0%, 42%);
line-height: 1.5;
}

.author {
display: flex;
align-items: center;
gap: 12px;
margin-top: 4px;
}

.author img {
width: 32px;
height: 32px;
border-radius: 50%;
}

.author-name {
font-size: 14px;
font-weight: 800;
color: hsl(0, 0%, 7%);
}

.attribution {
font-size: 11px;
text-align: center;
margin-top: 20px;
color: hsl(0, 0%, 7%);
}

.attribution a {
color: hsl(228, 45%, 44%);
}

</style>
</head>
